plugins { id 'com.android.application' }

android {
    namespace 'dev.usbmic.inspector'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.usbmic.inspector'
        minSdk 34
        targetSdk 35
        versionCode 11
        versionName '0.11-diagnostic'
        testInstrumentationRunner 'dev.usbmic.inspector.LocalAdbSmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation project(':localadb')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    maxHeapSize = '1536m'
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
    systemProperty 'dongleroute.screenshots', rootProject.file('evidence/0.11/screenshots').absolutePath
}

def helperSources = rootProject.fileTree('routing-helper/src/main/java') { include '**/*.java' }
def helperClasses = layout.buildDirectory.dir('routing-helper/classes')
def helperAssets = layout.buildDirectory.dir('generated/routing-helper-assets')
def helperDex = layout.buildDirectory.dir('routing-helper/dex')

tasks.register('compileRoutingHelper', JavaCompile) {
    source = helperSources
    classpath = files(android.bootClasspath)
    destinationDirectory = helperClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.bootstrapClasspath = files(android.bootClasspath)
}

def helperTestJar = tasks.register('routingHelperTestJar', Jar) {
    dependsOn 'compileRoutingHelper'
    from(helperClasses)
    archiveFileName = 'routing-helper-test-classes.jar'
    destinationDirectory = layout.buildDirectory.dir('routing-helper/test-fixture')
}
dependencies { testImplementation files(helperTestJar.flatMap { it.archiveFile }) }

tasks.register('dexRoutingHelper') {
    dependsOn 'compileRoutingHelper'
    inputs.files(helperSources)
    outputs.file(helperAssets.map { it.file('routing-helper.jar') })
    doLast {
        def classesDir = helperClasses.get().asFile
        def dexDir = helperDex.get().asFile
        def assetsDir = helperAssets.get().asFile
        dexDir.mkdirs()
        assetsDir.mkdirs()
        def d8Jar = new File(android.sdkDirectory, 'build-tools/35.0.0/lib/d8.jar')
        def classFiles = fileTree(classesDir) { include '**/*.class' }.files.collect { it.absolutePath }.sort()
        if (classFiles.isEmpty()) throw new GradleException('Routing helper source produced no classes')
        javaexec {
            classpath = files(d8Jar)
            mainClass = 'com.android.tools.r8.D8'
            maxHeapSize = '512m'
            args '--min-api', '34', '--lib', android.bootClasspath.first().absolutePath, '--output', dexDir.absolutePath
            args classFiles
        }
        ant.zip(destfile: new File(assetsDir, 'routing-helper.jar')) {
            fileset(dir: dexDir) { include(name: 'classes*.dex') }
        }
    }
}

android.sourceSets.main.assets.srcDir(helperAssets)
tasks.named('preBuild').configure { dependsOn 'dexRoutingHelper' }
